# Self-hosting: LeadCommons + Postgres + Caddy (automatic HTTPS).
# Files needed next to this one: Caddyfile and .env (see .env.example).
name: leadcommons

services:
  app:
    image: ghcr.io/aymaneprojects/leadcommons:latest
    restart: unless-stopped
    environment:
      LEADCOMMONS_MODE: server
      LEADCOMMONS_COOKIE_SECURE: "1"
      LEADCOMMONS_PASSWORD_HASH: ${LEADCOMMONS_PASSWORD_HASH:?set LEADCOMMONS_PASSWORD_HASH in .env}
      LEADCOMMONS_SECRET_KEY: ${LEADCOMMONS_SECRET_KEY:?set LEADCOMMONS_SECRET_KEY in .env}
      LEADCOMMONS_DATABASE_URL: postgresql+psycopg://leadcommons:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/leadcommons
    volumes:
      - app-data:/data
    depends_on:
      db:
        condition: service_healthy
    # Download the latest company pack on first start, then serve.
    command:
      - sh
      - -c
      - |
        if ! ls /data/packs/*.parquet >/dev/null 2>&1; then
          leadcommons pack download latest || echo "No pack downloaded; using the bundled sample."
        fi
        exec leadcommons serve --host 0.0.0.0 --port 8000

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: leadcommons
      POSTGRES_DB: leadcommons
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leadcommons -d leadcommons"]
      interval: 5s
      timeout: 5s
      retries: 10

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  app-data:
  db-data:
  caddy-data:
  caddy-config:
