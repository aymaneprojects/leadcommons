name: Build data packs

on:
  schedule:
    - cron: "17 3 1 * *"
  workflow_dispatch:
    inputs:
      countries:
        description: "Space-separated ISO country codes (empty = all)"
        required: false
        default: "FR DE GB US ES IT NL BE CA MA"
      limit:
        description: "Max companies per source and country"
        required: false
        default: "1500"

permissions:
  contents: read

concurrency:
  group: packs
  cancel-in-progress: false

jobs:
  build-pack:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install
        run: uv sync --python 3.13 --extra build
      - name: Build pack
        env:
          COUNTRIES: ${{ inputs.countries || 'FR DE GB US ES IT NL BE CA MA' }}
          LIMIT: ${{ inputs.limit || '1500' }}
          # SEC EDGAR asks every client to declare a contact address in its User-Agent.
          # Set it as the repository variable EDGAR_CONTACT_EMAIL; without it EDGAR is skipped.
          LEADCOMMONS_CONTACT_EMAIL: ${{ vars.EDGAR_CONTACT_EMAIL }}
        run: |
          args=()
          for c in $COUNTRIES; do args+=(--country "$c"); done
          uv run leadcommons pack build "${args[@]}" --limit "$LIMIT" --out packs-out
          ls -l packs-out
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="packs-$(date -u +%Y-%m)"
          parquet=$(find packs-out -maxdepth 1 -name 'companies-*.parquet' | sort | tail -n 1)
          attribution=$(find packs-out -maxdepth 1 -name '*ATTRIBUTION*.md' | head -n 1)
          if [ -z "$attribution" ]; then
            attribution=packs-out/ATTRIBUTION.md
            printf '# Attribution\n\nBuilt from open company registers. See docs/data-sources.md.\n' > "$attribution"
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$parquet" "$attribution" --clobber
          else
            gh release create "$tag" "$parquet" "$attribution" \
              --latest=false \
              --title "Company pack $tag" \
              --notes "Monthly company pack built from open data. See ATTRIBUTION.md for sources and licences."
          fi
