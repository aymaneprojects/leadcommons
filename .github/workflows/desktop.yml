name: Desktop apps

# The installable LeadCommons app, built like the big desktop apps: an Electron shell (window,
# menus, dialogs, notifications) around the frozen Python backend. Windows (setup .exe),
# macOS on Apple Silicon (.dmg) and Linux (.AppImage and .deb). Every build is started for
# real and checked, screenshots included, then attached to the GitHub release of the tag.
on:
  push:
    tags: ["v*"]
    branches: [main, "feature/desktop"]
    paths:
      - "desktop/**"
      - "packaging/desktop/**"
      - "src/leadcommons/desktop.py"
      - ".github/workflows/desktop.yml"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

# Publishing a release on github.com fires both "push" (tag) and "release": keep only the newest.
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
            builder: --win
          - os: macos-latest
            target: macos-arm64
            builder: --mac
          - os: ubuntu-22.04 # older glibc: the Linux builds run on more distributions
            target: linux-x86_64
            builder: --linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false" # no paid signing certificate yet
      LEADCOMMONS_DESKTOP_NO_DOWNLOAD: "1" # smoke tests use the built-in sample data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/electron/package-lock.json
      - name: Install the backend's dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install . "pyinstaller>=6.10,<7"
      - name: Version
        id: v
        run: echo "version=$(python -c 'import leadcommons; print(leadcommons.__version__)')" >> "$GITHUB_OUTPUT"

      - name: Freeze the backend (PyInstaller)
        run: pyinstaller --noconfirm --clean packaging/desktop/leadcommons.spec
      - name: Smoke test the backend
        env:
          LEADCOMMONS_HOME: ${{ runner.temp }}/lc-backend
        run: |
          exe=dist/leadcommons-backend/leadcommons-backend
          [ "$RUNNER_OS" = "Windows" ] && exe="$exe.exe"
          bash packaging/desktop/smoke.sh "$exe" 8765

      - name: Install the desktop shell (Electron)
        working-directory: desktop/electron
        run: |
          npm ci --no-audit --no-fund
          npm run check
          npm version "${{ steps.v.outputs.version }}" --no-git-tag-version --allow-same-version
      - name: Build the installers (electron-builder)
        working-directory: desktop/electron
        run: npx electron-builder ${{ matrix.builder }} --publish never

      - name: Smoke test the app (Linux)
        if: runner.os == 'Linux'
        env:
          LEADCOMMONS_HOME: ${{ runner.temp }}/lc-app
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb imagemagick >/dev/null
          out="$RUNNER_TEMP/smoke"
          xvfb-run -a -s "-screen 0 1500x960x24" dist-desktop/linux-unpacked/leadcommons-desktop \
            --no-sandbox --disable-gpu --smoke-test="$out/unpacked"
          node desktop/electron/scripts/check-smoke.js "$out/unpacked"
          app="$(ls dist-desktop/*.AppImage)"
          chmod +x "$app"
          APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a -s "-screen 0 1500x960x24" "$app" \
            --no-sandbox --disable-gpu --smoke-test="$out/appimage"
          node desktop/electron/scripts/check-smoke.js "$out/appimage"
          # A picture of the whole screen: window and menu bar as the user sees them.
          cat > "$RUNNER_TEMP/shot.sh" <<EOF
          dist-desktop/linux-unpacked/leadcommons-desktop --no-sandbox --disable-gpu --smoke-test="$out/screen" --smoke-hold=8 &
          sleep 14
          import -window root "$out/screen-linux.png"
          wait
          EOF
          xvfb-run -a -s "-screen 0 1500x960x24" sh "$RUNNER_TEMP/shot.sh"

      - name: Smoke test the app (macOS)
        if: runner.os == 'macOS'
        env:
          LEADCOMMONS_HOME: ${{ runner.temp }}/lc-app
        run: |
          out="$RUNNER_TEMP/smoke"
          mnt="$(mktemp -d)"
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" dist-desktop/*.dmg
          app="$mnt/LeadCommons.app/Contents/MacOS/LeadCommons"
          "$app" --smoke-test="$out/dmg"
          node desktop/electron/scripts/check-smoke.js "$out/dmg"
          "$app" --smoke-test="$out/screen" --smoke-hold=10 &
          sleep 14
          screencapture -x "$out/screen-macos.png" || true
          wait
          hdiutil detach "$mnt" || true

      - name: Install silently (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = (Get-Item dist-desktop\LeadCommons-*-setup.exe).FullName
          $p = Start-Process -Wait -PassThru -FilePath $setup -ArgumentList '/S'
          if ($p.ExitCode -ne 0) { throw "installer exit code $($p.ExitCode)" }
          # Per-user install: %LOCALAPPDATA%\Programs\<folder named by electron-builder>\LeadCommons.exe
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter LeadCommons.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw "LeadCommons.exe was not installed" }
          Write-Host "Installed: $($exe.FullName)"
          "LC_EXE=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $lnk = Get-ChildItem "$env:APPDATA\Microsoft\Windows\Start Menu" -Recurse -Filter "LeadCommons*.lnk" -ErrorAction SilentlyContinue
          if (-not $lnk) { throw "no Start menu shortcut" }
          Write-Host "Start menu shortcut: $($lnk[0].FullName)"
      - name: Smoke test the installed app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          LEADCOMMONS_HOME: ${{ runner.temp }}\lc-app
        run: |
          $exe = $env:LC_EXE
          $out = "$env:RUNNER_TEMP\smoke"
          $p = Start-Process -Wait -PassThru -FilePath $exe -ArgumentList "--smoke-test=$out\installed"
          node desktop/electron/scripts/check-smoke.js "$out\installed"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # A picture of the whole screen: window, title bar and menu as the user sees them.
          Start-Process -FilePath $exe -ArgumentList "--smoke-test=$out\screen", "--smoke-hold=10"
          Start-Sleep -Seconds 14
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$out\screen-windows.png")
          Start-Sleep -Seconds 4

      - name: Print screenshots to the log (feature branches)
        if: always() && startsWith(github.ref, 'refs/heads/feature/')
        continue-on-error: true
        run: |
          python -m pip install --quiet pillow
          python packaging/desktop/print_shots.py "$RUNNER_TEMP/smoke"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: |
            dist-desktop/LeadCommons-*
            !dist-desktop/*.blockmap
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-${{ matrix.target }}
          path: ${{ runner.temp }}/smoke
          if-no-files-found: ignore

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: out
      - name: Checksums
        run: cd out && sha256sum -- * > SHA256SUMS-desktop.txt && cat SHA256SUMS-desktop.txt
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          # The Release workflow may still be creating the release for a pushed tag.
          for _ in $(seq 1 30); do
            if gh release view "$TAG" >/dev/null 2>&1; then break; fi
            sleep 20
          done
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" out/* --clobber
