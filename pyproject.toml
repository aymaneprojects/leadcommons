[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "leadcommons"
version = "0.1.0.dev0"
description = "Free, open-source, local-first prospecting: find companies, people and verified emails from public data."
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "sqlalchemy>=2.0",
    "duckdb>=1.1",
    "httpx>=0.27",
    "selectolax>=0.3.21",
    "dnspython>=2.6",
    "email-validator>=2.2",
    "typer>=0.12",
    "itsdangerous>=2.2",
    "mcp>=2.3,<3",
    "cryptography>=43",
]

[project.optional-dependencies]
server = ["psycopg[binary]>=3.2"]
# Only needed to build company packs (`leadcommons pack build`); the app reads packs with DuckDB.
build = ["pyarrow>=17"]
dev = ["pyarrow>=17", "pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.7", "respx>=0.21", "actionlint-py>=1.7", "shellcheck-py>=0.10"]

[project.scripts]
leadcommons = "leadcommons.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/leadcommons"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.vercel]
entrypoint = "vercel_app:app"

[tool.vercel.scripts]
build = "python scripts/vercel_build.py"
