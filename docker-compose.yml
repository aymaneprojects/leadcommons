# One-command local run:  docker compose up --build
# Then open http://127.0.0.1:8000 . Your data lives in ./data
services:
  pepite:
    build: .
    image: pepite:local
    restart: unless-stopped
    environment:
      PEPITE_MODE: local
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:8000:8000"
