# One-command local run:  docker compose up --build
# Then open http://127.0.0.1:8000 . Your data lives in the pepite-data volume
services:
  pepite:
    build: .
    image: pepite:local
    restart: unless-stopped
    environment:
      PEPITE_MODE: local
    volumes:
      - pepite-data:/data # a named volume: the image's user (10001) can write to it on any OS
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  pepite-data:
